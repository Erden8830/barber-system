<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barber Pro — Booking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.card{max-width:360px;width:100%}
.logo{font-size:.85rem;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.3);margin-bottom:48px;text-transform:uppercase}
.logo span{color:#d4a017}
.emoji{font-size:4.5rem;margin-bottom:24px}
h1{font-size:2rem;font-weight:800;letter-spacing:-1px;margin-bottom:12px;color:#d4a017}
p{font-size:.95rem;color:rgba(255,255,255,.5);line-height:1.6;max-width:300px;margin:0 auto}
.divider{width:40px;height:2px;background:#d4a017;margin:32px auto}
.footer{font-size:.65rem;color:rgba(255,255,255,.15);margin-top:48px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Barber<span>.</span>Pro</div>
  <div class="emoji">📅</div>
  <h1>Цаг Захиалга</h1>
  <p>Instagram био холбоосоор 24/7 захиалга авна. Үйлчлүүлэгч өөрөө цагаа сонгоно.</p>
  <div class="divider"></div>
  <div class="footer">7 хоног үнэгүй · barberpro.mn</div>
</div>
</body>
</html>
