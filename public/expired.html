<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бүртгэл дууссан — Barber Pro</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#111;border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:48px 32px;max-width:420px;text-align:center}
.logo{font-size:1rem;font-weight:700;color:#fff;margin-bottom:24px}.logo span{color:#d4a017}
.icon{font-size:3.5rem;margin-bottom:16px}
h1{font-size:1.15rem;color:#fff;margin-bottom:8px}
p{font-size:.82rem;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:20px}
.phone-box{background:rgba(212,160,23,.08);border:1px solid rgba(212,160,23,.15);border-radius:12px;padding:16px;margin-bottom:20px}
.phone-label{font-size:.68rem;color:rgba(212,160,23,.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.phone{font-size:1.3rem;font-weight:700;color:#d4a017}
.footer{font-size:.68rem;color:rgba(255,255,255,.2);margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Barber<span>.</span>Pro</div>
  <div class="icon">⏱️</div>
  <h1>Туршилтын хугацаа дууссан</h1>
  <p>Таны 7 хоногийн үнэгүй туршилт дууслаа. Системийг үргэлжлүүлэн ашиглахын тулд доорх утас руу холбогдож, сарын төлбөрөө төлнө үү.</p>
  <div class="phone-box"><div class="phone-label">Холбогдох утас</div><div class="phone">📞 85279299</div></div>
  <p style="font-size:.72rem;color:rgba(255,255,255,.25)">Төлбөр хийсний дараа таны бүртгэл шууд идэвхжинэ.</p>
  <div class="footer">Barber Pro · Сарын 99,000₮</div>
</div>
</body>
</html>
