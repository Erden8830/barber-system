<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0}
body{width:1080px;height:1080px;background:#0a0a0a;text-align:center}
.wrap{padding-top:340px}
.mark{display:inline-block;width:200px;height:200px;background:#d4a017;border-radius:50px;position:relative}
.mark-v{position:absolute;top:20px;bottom:20px;left:50%;width:50px;background:#0a0a0a;border-radius:8px;margin-left:-25px}
.mark-h{position:absolute;left:20px;right:20px;top:50%;height:50px;background:#0a0a0a;border-radius:8px;margin-top:-25px}
</style></head><body>
<div class="wrap">
  <div class="mark">
    <div class="mark-v"></div>
    <div class="mark-h"></div>
  </div>
</div>
</body></html>
