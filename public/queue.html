    28|<body>
    29|<div class="card">
    30|  <div style="font-size:2rem;margin-bottom:8px">🚶</div>
    31|  <h1>Дараалалд зогсох</h1>
    32|  <p class="sub">Барбер, үйлчилгээ сонгоод бүртгүүлнэ үү</p>
    33|  <div id="join">
    34|    <div class="barbers" id="barberList"></div>
    35|    <select id="svcPick"><option value="">Үйлчилгээ сонгох</option></select>
    36|    <input type="text" id="name" placeholder="Таны нэр">

    38|    <div id="error" class="error"></div>

    42|  <div class="position" id="position">
    43|    <div class="num" id="posNum">#0</div><div class="lbl">Таны ээлж</div><div class="barber-name" id="posBarber"></div><div class="svc-name" id="posSvc"></div><div class="status" id="posStatus"></div><div class="wait" id="posWait"></div><div class="ahead" id="posAhead"></div><button class="btn" onclick="checkStatus()" style="font-size:.82rem">🔄 Шинэчлэх</button>

    46|<script>
    47|const SLUG=window.location.pathname.split('/')[2],API=location.origin;
    48|/* Restore queue session on page load */
    49|(function(){
    50|  var saved;
    51|  try{saved=localStorage.getItem("bp_q_"+(window.location.pathname.split("/")[2]||""))}catch(e){}
    52|  if(saved){
    53|    document.getElementById("phone").value=saved;
    54|    document.getElementById("join").style.display="none";
    55|    startPolling();
    56|  }
    57|})();

    59|let selectedBarber=null,barbers=[],pt=null,pt=null;
    60|(function ws(){const p=location.protocol==='https:'?'wss:':'ws:';try{const s=new WebSocket(p+'//'+location.host+'/ws?shop='+SLUG);s.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type!=='connected')checkStatus()}catch(e){}};s.onclose=()=>setTimeout(ws,5000)}catch(e){setTimeout(ws,5000)}})();
    61|async function loadBarbers(){try{const today=new Date().toISOString().slice(0,10);const b=await fetch(API+'/api/shop/'+SLUG+'/barbers?date='+today);barbers=await b.json();let h='<div class="barber-btn" data-id="" onclick="selectBarber(this,\'\')">✂️ Аль ч</div>';barbers.forEach(b=>{h+='<div class="barber-btn" data-id="'+b.id+'" onclick="selectBarber(this,\''+b.id+'\')">✂️ '+b.name+'</div>'});document.getElementById('barberList').innerHTML=h;const f=document.querySelector('.barber-btn');if(f)selectBarber(f,'');loadServices()}catch(e){console.error(e)}}
    62|function selectBarber(el,id){document.querySelectorAll('.barber-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');selectedBarber=id}
    63|async function joinQueue(){const p=document.getElementById('phone').value.replace(/[\s-]/g,''),n=document.getElementById('name').value.trim(),er=document.getElementById('error');if(!p||p.length<6){er.textContent='Утасны дугаараа зөв оруулна уу';er.style.display='block';return}er.style.display='none';document.getElementById('join').style.display='none';document.getElementById('spinner').style.display='block';try{const b={phone:p};if(n)b.customer_name=n;if(selectedBarber)b.barber_id=selectedBarber;const s=document.getElementById('svcPick').value;if(s)b.service_id=s;const r=await fetch(API+'/api/shop/'+SLUG+'/queue/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();document.getElementById('spinner').style.display='none';if(d.success){const bb=barbers.find(x=>x.id===selectedBarber);showPosition(d.position,'waiting',null,null,bb?.name,null,null);startPolling();try{localStorage.setItem('bp_q_'+SLUG,document.getElementById('phone').value.replace(/[\s-]/g,''))}catch(e){}}else{document.getElementById('join').style.display='block';er.textContent=d.error;er.style.display='block'}}catch(ex){console.error(ex);document.getElementById('spinner').style.display='none';document.getElementById('join').style.display='block';er.textContent='Алдаа гарлаа';er.style.display='block'}}
    64|function showPosition(pos,st,ahead,total,bn,sn,em){document.getElementById('position').style.display='block';document.getElementById('posNum').textContent='#'+pos;document.getElementById('posBarber').textContent=bn?'✂️ '+bn:'';document.getElementById('posSvc').textContent=sn||'';if(st==='serving')document.getElementById('posStatus').textContent='🔴 Таны ээлж ирлээ!';else if(st==='called')document.getElementById('posStatus').textContent='📞 Тань дуудаж байна';else document.getElementById('posStatus').textContent='⏳ Хүлээж байна';if(em>0)document.getElementById('posWait').textContent='~'+em+' мин хүлээх';else document.getElementById('posWait').textContent='';if(ahead!=null&&total!=null)document.getElementById('posAhead').textContent='Тань өмнө '+ahead+' хүн. Нийт: '+total;else document.getElementById('posAhead').textContent=''}
    65|function startPolling(){pt=setInterval(checkStatus,5000);checkStatus()}
    66|async function loadServices(){try{const r=await fetch(API+'/api/shop/'+SLUG+'/services');const d=await r.json();const s=document.getElementById('svcPick');if(s)s.innerHTML='<option value="">Үйлчилгээ сонгох</option>'+d.map(s=>'<option value="'+s.id+'">'+s.name+' · '+s.price.toLocaleString()+'₮ · '+s.duration+' мин</option>').join('')}catch(e){console.error(e)}}
    67|async function checkStatus(){const p=document.getElementById('phone').value.replace(/[\s-]/g,'');if(!p)return;const btn=document.querySelector('#position .btn');if(btn){btn.disabled=true;btn.textContent='⏳'}try{const r=await fetch(API+'/api/shop/'+SLUG+'/queue/status?phone='+p);const d=await r.json();if(d.inQueue){showPosition(d.position,d.status,d.ahead,d.total,d.barber_name,d.service,d.estimated_min);if(d.status==='serving'||d.status==='called'){document.getElementById('posStatus').textContent='🔴 Таны ээлж ирлээ!';if(pt)clearInterval(pt)}}}catch(e){console.error(e)}if(btn){btn.disabled=false;btn.textContent='🔄 Шинэчлэх'}}
    68|loadBarbers();
    69|</script>
