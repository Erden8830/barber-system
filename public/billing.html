<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing — Barber Pro</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;max-width:1000px;margin:0 auto}
h1{font-size:1.2rem;color:#fff;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-size:.65rem;text-transform:uppercase;letter-spacing:.5px}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.65rem;font-weight:600}
.status.trial{background:rgba(212,160,23,.15);color:#d4a017}
.status.active{background:rgba(46,204,113,.15);color:#2ecc71}
.status.expired{background:rgba(231,76,60,.15);color:#e74c3c}
.btn-sm{padding:5px 8px;border:1px solid rgba(255,255,255,.1);border-radius:5px;background:transparent;color:#fff;font-size:.65rem;cursor:pointer;font-family:inherit;margin:1px}
.btn-sm:hover{background:rgba(255,255,255,.06)}
.btn-sm.green{border-color:rgba(46,204,113,.3);color:#2ecc71}
.btn-sm.red{border-color:rgba(231,76,60,.3);color:#e74c3c}
.btn-sm.gold{background:#d4a017;color:#0a0a0a;border:none;font-weight:600}
.edit-inp{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:4px;color:#fff;padding:3px 6px;font-size:.7rem;font-family:inherit;width:90px}
.edit-inp:focus{border-color:#d4a017;outline:none}
input.key{width:100%;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:.82rem;background:#111;color:#fff;outline:none;margin-bottom:16px;font-family:inherit}input.key:focus{border-color:#d4a017}
.hidden{display:none}.loading{text-align:center;color:rgba(255,255,255,.3);padding:40px}
</style>
</head>
<body>
<div id="login"><h1>💰 Billing Admin</h1><input class="key" type="password" id="masterKey" placeholder="Master key" onkeydown="if(event.key==='Enter')login()"><button class="btn-sm gold" onclick="login()" style="padding:10px 20px;font-size:.82rem">Нэвтрэх</button></div>
<div id="app" class="hidden"><h1>💰 Billing — <span style="color:#d4a017">Barber Pro</span></h1>
  <table><thead><tr><th>Дэлгүүр</th><th>Эзэмшигч</th><th>Утас</th><th>План</th><th>Төлөв</th><th>Дуусах</th><th>Зах.</th><th>Хар.</th><th>Үйлдэл</th></tr></thead><tbody id="shopList"><tr><td colspan="9" class="loading">Ачааллаж байна...</td></tr></tbody></table></div>
<script>
var A=location.origin,K='';
function login(){var k=document.getElementById('masterKey').value;if(!k)return;K=k;var b=document.querySelector('#login button');if(b){b.disabled=true;b.textContent='Шалгаж байна...'}load()}
function btn(t,c,h){var b=document.createElement('button');b.className='btn-sm '+c;b.textContent=t;b.onclick=h;return b}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function td(v){var d=document.createElement('td');if(typeof v==='string')d.innerHTML=v;else d.appendChild(v);return d}
async function load(){try{var r=await fetch(A+'/api/billing/shops',{headers:{'x-master-key':K}});if(!r.ok){alert('Буруу түлхүүр');var b=document.querySelector('#login button');if(b){b.disabled=false;b.textContent='Нэвтрэх'}return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');var shops=await r.json();var sl={trial:'Туршилт',active:'Идэвхтэй',expired:'Дууссан'},sc={trial:'trial',active:'active',expired:'expired'};var tb=document.getElementById('shopList');tb.innerHTML='';shops.forEach(function(s){var ea=s.sub_status==='trial'?s.trial_ends_at:s.sub_ends_at;var tr=document.createElement('tr');tr.appendChild(td('<a href="/shop/'+esc(s.slug)+'" style="color:#d4a017;text-decoration:none">'+esc(s.name)+'</a><br><span style="color:rgba(255,255,255,.3);font-size:.62rem">'+esc(s.slug)+'</span>'));tr.appendChild(td('<input class="edit-inp" value="'+esc(s.owner_name||'')+'" onchange="saveInfo(\''+s.id+'\',\'owner_name\',this.value)" placeholder="Нэр">'));tr.appendChild(td('<input class="edit-inp" value="'+esc(s.phone||'')+'" onchange="saveInfo(\''+s.id+'\',\'phone\',this.value)" placeholder="Утас" style="width:80px">'));var pc=btn((s.plan||'pro').toUpperCase(),(s.plan==='basic'?'':'gold'),function(){togglePlan(s.id,s.plan||'pro')});pc.style.fontSize='.62rem';pc.style.padding='3px 8px';tr.appendChild(td(pc));tr.appendChild(td('<span class="status '+sc[s.sub_status]+'">'+sl[s.sub_status]+'</span>'));tr.appendChild(td(ea||'—'));tr.appendChild(td(String(s.total_bookings||0)));tr.appendChild(td(String(s.total_customers||0)));var atd=td('');atd.appendChild(btn('+1с','green',function(){activateShop(s.id,1)}));atd.appendChild(document.createTextNode(' '));atd.appendChild(btn('+3с','green',function(){activateShop(s.id,3)}));if(s.sub_status!=='expired'){atd.appendChild(document.createTextNode(' '));atd.appendChild(btn('✕','red',function(){deactivateShop(s.id)}))}atd.appendChild(document.createTextNode(' '));var rb=btn('🔑','',function(){resetPassword(s.id,s.name)});rb.style.borderColor='rgba(212,160,23,.3)';rb.style.color='#d4a017';atd.appendChild(rb);atd.appendChild(document.createTextNode(' '));var db=btn('🗑','',function(){deleteShop(s.id,s.name)});db.style.borderColor='rgba(231,76,60,.5)';db.style.color='#e74c3c';atd.appendChild(db);tr.appendChild(atd);tb.appendChild(tr)});if(!shops.length)tb.innerHTML='<tr><td colspan="9" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Дэлгүүр байхгүй</td></tr>'}catch(e){document.getElementById('shopList').innerHTML='<tr><td colspan="9" style="color:#e74c3c">Алдаа гарлаа</td></tr>'}}
async function saveInfo(id,f,v){try{var b={shop_id:id};b[f]=v;await fetch(A+'/api/billing/update-shop',{method:'POST',headers:{'Content-Type':'application/json','x-master-key':K},body:JSON.stringify(b)})}catch(e){}}
async function activateShop(id,m){try{var r=await fetch(A+'/api/billing/activate',{method:'POST',headers:{'Content-Type':'application/json','x-master-key':K},body:JSON.stringify({shop_id:id,months:m})});var d=await r.json();if(d.success)load()}catch(e){}}
async function deactivateShop(id){if(!confirm('Энэ дэлгүүрийг блоклох уу?'))return;try{var r=await fetch(A+'/api/billing/deactivate',{method:'POST',headers:{'Content-Type':'application/json','x-master-key':K},body:JSON.stringify({shop_id:id})});var d=await r.json();if(d.success)load()}catch(e){}}
async function deleteShop(id,name){if(!confirm('⚠️ "'+name+'" дэлгүүрийг УСТГАХ уу?'))return;if(!confirm('Энэ үйлдлийг БУЦААХ БОЛОМЖГҮЙ. Үргэлжлүүлэх үү?'))return;try{var r=await fetch(A+'/api/billing/delete-shop',{method:'POST',headers:{'Content-Type':'application/json','x-master-key':K},body:JSON.stringify({shop_id:id})});var d=await r.json();if(d.success)load()}catch(e){}}
async function resetPassword(id,name){var pw=prompt('"'+name+'" дэлгүүрийн ШИНЭ нууц үг (дор хаяж 4 тэмдэгт):');if(!pw||pw.length<4)return alert('Дор хаяж 4 тэмдэгт оруулна уу');try{var r=await fetch(A+'/api/billing/reset-password',{method:'POST',headers:{'Content-Type':'application/json','x-master-key':K},body:JSON.stringify({shop_id:id,new_password:pw})});var d=await r.json();if(d.success)alert('Нууц үг солигдлоо: '+pw)}catch(e){}}
</script>
</body>
</html>
